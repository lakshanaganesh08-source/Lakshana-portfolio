<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111726" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161f30" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0e1522" stop-opacity="0.9" />
    </linearGradient>

    <!-- CAD Sphere Shading -->
    <radialGradient id="cadShading" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#0284c7" />
      <stop offset="80%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#082f49" />
    </radialGradient>

    <!-- Arrow Gradient -->
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.95" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="480" rx="16" fill="url(#bgGrad)" />
  <rect width="1198" height="478" x="1" y="1" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Subtle Blueprint Grid -->
  <g opacity="0.12">
    <line x1="60" y1="40" x2="1140" y2="40" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 8" />
    <line x1="60" y1="120" x2="1140" y2="120" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 8" />
    <line x1="60" y1="360" x2="1140" y2="360" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 8" />
    <line x1="60" y1="440" x2="1140" y2="440" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 8" />
    <line x1="100" y1="40" x2="100" y2="440" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 8" />
    <line x1="420" y1="40" x2="420" y2="440" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 8" />
    <line x1="780" y1="40" x2="780" y2="440" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 8" />
    <line x1="1100" y1="40" x2="1100" y2="440" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 8" />
  </g>

  <!-- Header Banner -->
  <text x="60" y="52" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="2">STL DATA TRANSFORMATION PIPELINE · DIGITAL-TO-PHYSICAL</text>
  <text x="1140" y="52" text-anchor="end" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="11" font-weight="600" letter-spacing="1">SURFACE TESSELLATION &amp; SLICING</text>

  <!-- ==================== STAGE 1: 3D CAD SURFACE ==================== -->
  <g transform="translate(60, 80)">
    <!-- Stage Card Box -->
    <rect width="320" height="340" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.2" />
    
    <!-- Stage Header Badge -->
    <rect x="20" y="20" width="84" height="22" rx="4" fill="#0284c7" fill-opacity="0.18" stroke="#0284c7" stroke-width="1" />
    <text x="62" y="35" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="1">STAGE 01</text>
    
    <!-- Stage Title -->
    <text x="20" y="66" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">3D CAD Surface</text>
    <text x="20" y="86" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Continuous solid / boundary representation</text>
    
    <!-- Graphical Representation: Smooth 3D CAD Sphere with Isoparametric curves -->
    <g transform="translate(160, 195)">
      <!-- Smooth Solid Sphere -->
      <circle cx="0" cy="0" r="68" fill="url(#cadShading)" filter="url(#glow)" />
      
      <!-- Isoparametric UV Surface Curves -->
      <!-- Equator -->
      <ellipse cx="0" cy="0" rx="68" ry="24" fill="none" stroke="#7dd3fc" stroke-width="1.2" stroke-opacity="0.7" />
      <!-- Latitude +30 -->
      <ellipse cx="0" cy="-28" rx="62" ry="18" fill="none" stroke="#bae6fd" stroke-width="1" stroke-opacity="0.5" />
      <!-- Latitude -30 -->
      <ellipse cx="0" cy="28" rx="62" ry="18" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
      <!-- Longitude 1 -->
      <ellipse cx="0" cy="0" rx="28" ry="68" fill="none" stroke="#bae6fd" stroke-width="1" stroke-opacity="0.5" />
      <!-- Surface Specular Highlight -->
      <ellipse cx="-24" cy="-28" rx="14" ry="8" fill="#ffffff" fill-opacity="0.45" transform="rotate(-25 -24 -28)" />
    </g>

    <!-- Stage Footer Description -->
    <text x="160" y="295" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Mathematical NURBS Curves</text>
    <text x="160" y="315" text-anchor="middle" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Infinite precision CAD boundary</text>
  </g>

  <!-- ==================== CONNECTOR 1 -> 2 ==================== -->
  <g transform="translate(392, 235)">
    <line x1="0" y1="0" x2="36" y2="0" stroke="url(#arrowGrad)" stroke-width="3" stroke-linecap="round" />
    <polygon points="36,-5 46,0 36,5" fill="#38bdf8" />
    <text x="23" y="-12" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" letter-spacing="0.5">TESSELLATE</text>
  </g>

  <!-- ==================== STAGE 2: TRIANGULAR STL MESH ==================== -->
  <g transform="translate(440, 80)">
    <!-- Stage Card Box -->
    <rect width="320" height="340" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.2" />
    
    <!-- Stage Header Badge -->
    <rect x="20" y="20" width="84" height="22" rx="4" fill="#6366f1" fill-opacity="0.2" stroke="#6366f1" stroke-width="1" />
    <text x="62" y="35" text-anchor="middle" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="1">STAGE 02</text>
    
    <!-- Stage Title -->
    <text x="20" y="66" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">Triangular STL Mesh</text>
    <text x="20" y="86" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Surface geometry approximated by planar facets</text>
    
    <!-- Graphical Representation: Icosahedron / Geodesic Sphere of Triangular Facets -->
    <g transform="translate(160, 195)">
      <!-- Underlying shaded facets -->
      <polygon points="0,-65 -38,-42 0,-20" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" />
      <polygon points="0,-65 0,-20 38,-42" fill="#312e81" stroke="#818cf8" stroke-width="1.2" />
      <polygon points="38,-42 0,-20 56,0" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.2" />
      <polygon points="0,-20 0,32 56,0" fill="#3730a3" stroke="#818cf8" stroke-width="1.2" />
      <polygon points="0,-20 -38,-42 -56,0" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" />
      <polygon points="-56,0 -38,42 0,32" fill="#312e81" stroke="#818cf8" stroke-width="1.2" />
      <polygon points="0,-20 -56,0 0,32" fill="#4338ca" stroke="#818cf8" stroke-width="1.2" />
      <polygon points="0,32 38,42 56,0" fill="#4f46e5" stroke="#818cf8" stroke-width="1.2" />
      <polygon points="0,32 0,65 38,42" fill="#312e81" stroke="#818cf8" stroke-width="1.2" />
      <polygon points="-38,42 0,65 0,32" fill="#3730a3" stroke="#818cf8" stroke-width="1.2" />
      <polygon points="-38,-42 -65,0 -56,0" fill="#0f172a" stroke="#818cf8" stroke-width="1.2" />
      <polygon points="38,-42 56,0 65,0" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.2" />
      <polygon points="-56,0 -65,0 -38,42" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" />
      <polygon points="56,0 65,0 38,42" fill="#312e81" stroke="#818cf8" stroke-width="1.2" />
      <polygon points="-38,-42 0,-65 -65,0" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" />
      <polygon points="38,-42 0,-65 65,0" fill="#312e81" stroke="#818cf8" stroke-width="1.2" />
      
      <!-- Triangle Vertex Dots -->
      <circle cx="0" cy="-65" r="2.5" fill="#c7d2fe" />
      <circle cx="-38" cy="-42" r="2.5" fill="#c7d2fe" />
      <circle cx="38" cy="-42" r="2.5" fill="#c7d2fe" />
      <circle cx="0" cy="-20" r="3" fill="#ffffff" />
      <circle cx="-56" cy="0" r="2.5" fill="#c7d2fe" />
      <circle cx="56" cy="0" r="2.5" fill="#c7d2fe" />
      <circle cx="0" cy="32" r="3" fill="#ffffff" />
      <circle cx="-38" cy="42" r="2.5" fill="#c7d2fe" />
      <circle cx="38" cy="42" r="2.5" fill="#c7d2fe" />
      <circle cx="0" cy="65" r="2.5" fill="#c7d2fe" />
    </g>

    <!-- Stage Footer Description -->
    <text x="160" y="295" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Polygon Facet Array (.STL)</text>
    <text x="160" y="315" text-anchor="middle" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Vertex coordinates + Normal vectors</text>
  </g>

  <!-- ==================== CONNECTOR 2 -> 3 ==================== -->
  <g transform="translate(772, 235)">
    <line x1="0" y1="0" x2="36" y2="0" stroke="url(#arrowGrad)" stroke-width="3" stroke-linecap="round" />
    <polygon points="36,-5 46,0 36,5" fill="#38bdf8" />
    <text x="23" y="-12" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" letter-spacing="0.5">SLICE</text>
  </g>

  <!-- ==================== STAGE 3: SLICED LAYERS ==================== -->
  <g transform="translate(820, 80)">
    <!-- Stage Card Box -->
    <rect width="320" height="340" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.2" />
    
    <!-- Stage Header Badge -->
    <rect x="20" y="20" width="84" height="22" rx="4" fill="#10b981" fill-opacity="0.18" stroke="#10b981" stroke-width="1" />
    <text x="62" y="35" text-anchor="middle" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="1">STAGE 03</text>
    
    <!-- Stage Title -->
    <text x="20" y="66" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">Sliced Layers &amp; G-Code</text>
    <text x="20" y="86" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Discrete toolpaths for additive extrusion</text>
    
    <!-- Graphical Representation: Horizontal Layer Slices with Extrusion Toolpaths -->
    <g transform="translate(160, 195)">
      <!-- Layer 1 (Bottom) -->
      <ellipse cx="0" cy="54" rx="35" ry="9" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
      <line x1="-24" y1="54" x2="24" y2="54" stroke="#34d399" stroke-width="1" stroke-dasharray="2 2" />
      
      <!-- Layer 2 -->
      <ellipse cx="0" cy="38" rx="52" ry="13" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
      <line x1="-38" y1="38" x2="38" y2="38" stroke="#34d399" stroke-width="1" stroke-dasharray="2 2" />

      <!-- Layer 3 -->
      <ellipse cx="0" cy="20" rx="63" ry="16" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
      <line x1="-48" y1="20" x2="48" y2="20" stroke="#34d399" stroke-width="1" stroke-dasharray="2 2" />

      <!-- Layer 4 (Equator - active slice) -->
      <ellipse cx="0" cy="0" rx="68" ry="17" fill="#047857" stroke="#34d399" stroke-width="2" />
      <ellipse cx="0" cy="0" rx="56" ry="14" fill="none" stroke="#6ee7b7" stroke-width="1" stroke-dasharray="3 3" />
      <line x1="-54" y1="0" x2="54" y2="0" stroke="#a7f3d0" stroke-width="1.2" stroke-dasharray="2 2" />

      <!-- Layer 5 -->
      <ellipse cx="0" cy="-18" rx="62" ry="15" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
      <line x1="-46" y1="-18" x2="46" y2="-18" stroke="#34d399" stroke-width="1" stroke-dasharray="2 2" />

      <!-- Layer 6 -->
      <ellipse cx="0" cy="-36" rx="50" ry="12" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
      <line x1="-35" y1="-36" x2="35" y2="-36" stroke="#34d399" stroke-width="1" stroke-dasharray="2 2" />

      <!-- Layer 7 (Top) -->
      <ellipse cx="0" cy="-52" rx="30" ry="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
      <line x1="-20" y1="-52" x2="20" y2="-52" stroke="#34d399" stroke-width="1" stroke-dasharray="2 2" />

      <!-- Layer Height Dimension Indicator on Right -->
      <g transform="translate(74, 0)">
        <line x1="0" y1="-18" x2="0" y2="0" stroke="#38bdf8" stroke-width="1.2" />
        <line x1="-3" y1="-18" x2="3" y2="-18" stroke="#38bdf8" stroke-width="1.2" />
        <line x1="-3" y1="0" x2="3" y2="0" stroke="#38bdf8" stroke-width="1.2" />
        <text x="6" y="-7" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700">0.20 mm</text>
      </g>
    </g>

    <!-- Stage Footer Description -->
    <text x="160" y="295" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Planar Toolpath Contours</text>
    <text x="160" y="315" text-anchor="middle" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">G-code motion commands: X, Y, Z, E</text>
  </g>

  <!-- Bottom Global Caption Banner -->
  <rect x="60" y="432" width="1080" height="26" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
  <text x="600" y="449" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">
    <tspan fill="#38bdf8" font-weight="700">Workflow Summary:</tspan> Solid CAD surface is tessellated into triangular planar facets (.STL), which the CAM slicer cuts into discrete horizontal layers and CNC G-code toolpaths.
  </text>
</svg>
