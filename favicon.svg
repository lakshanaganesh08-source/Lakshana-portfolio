<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sparkGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="25%" stop-color="#FDE047"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="sparkMini" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Main Sparkle Star (4-point curved diamond) -->
  <path d="M36 6 Q36 28 58 28 Q36 28 36 50 Q36 28 14 28 Q36 28 36 6 Z" fill="url(#sparkGold)" filter="url(#glow)"/>
  
  <!-- Secondary Bottom-Left Mini Sparkle -->
  <path d="M16 34 Q16 43 25 43 Q16 43 16 52 Q16 43 7 43 Q16 43 16 34 Z" fill="url(#sparkMini)"/>
  
  <!-- Small Top-Right Micro Sparkle -->
  <path d="M50 10 Q50 15 55 15 Q50 15 50 20 Q50 15 45 15 Q50 15 50 10 Z" fill="url(#sparkMini)"/>
</svg>
