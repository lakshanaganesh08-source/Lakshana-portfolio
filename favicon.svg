<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Obsidian Squircle Base -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="#27272A" stroke-width="1.5"/>

  <!-- Bold Geometric 'L' Monogram -->
  <path d="M20 15 C20 13.895 20.895 13 22 13 L27 13 C28.105 13 29 13.895 29 15 L29 42 L42 42 C43.105 42 44 42.895 44 44 L44 49 C44 50.105 43.105 51 42 51 L22 C20.895 51 20 50.105 20 49 Z" 
        fill="url(#brandGrad)" 
        filter="url(#subtleGlow)"/>

  <!-- Geometric Intersecting 'G' Accent Notch -->
  <path d="M34 23 C34 21.895 34.895 21 36 21 L47 21 C48.105 21 49 21.895 49 23 L49 33 C49 34.105 48.105 35 47 35 L39 35 C37.895 35 37 34.105 37 33 L37 31 C37 29.895 37.895 29 39 29 L42 29 L42 27 L36 27 C34.895 27 34 26.105 34 25 Z"
        fill="url(#brandGrad)"/>

  <!-- Cyan Tech Accent Beacon -->
  <circle cx="48" cy="15" r="3" fill="#38BDF8"/>
</svg>
